name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is a permissive floor (added 2026-09-09, ">=20.0.0") —
        # this package is loaded by whatever Node major the live self-hosted
        # n8n Docker image bundles, not a version this repo controls. Matrix
        # still exercises that floor through current LTS, matching
        # n8n-nodes-freedom24's existing pattern.
        node-version: ['20.x', '24.x']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Split per-leg (fixed 2026-09-10): npm@12.0.2 requires Node >=22.22.2,
      # incompatible with this matrix's own 20.x leg (added to test
      # engines.node's declared floor) — that leg failed EBADENGINE before
      # typecheck/test/lint/build ever ran, so it had zero real CI coverage
      # since the pin was added. No npm>=12 supports Node 20, so the 20.x leg
      # pins the exact npm version Node 20.x's setup-node actually resolves
      # (10.8.2) instead of an implicit "whatever's bundled", and skips
      # allowScripts enforcement (npm <12 has no such gate to enforce). See
      # systems/npm-dependency-policy/reference/ci-npm-pin-snippet.yml for
      # the canonical pattern.
      - name: Pin npm version (Node >=22)
        if: ${{ matrix.node-version != '20.x' }}
        run: npm install -g npm@12.0.2 # pinned, not @latest - npm 12 silently skips unapproved dependency install scripts by default; an unpinned bump on this live publish pipeline is how that behavior change would go unnoticed

      - name: Pin npm version (Node 20.x)
        if: ${{ matrix.node-version == '20.x' }}
        run: npm install -g npm@10.8.2

      - name: Fail loudly on any unapproved install script (Node >=22 only)
        if: ${{ matrix.node-version != '20.x' }}
        run: npm config set strict-allow-scripts true # npm 12 defaults to skip-and-warn; this makes an unreviewed script a hard install failure instead of a silent skip

      - name: Install dependencies (Node >=22)
        if: ${{ matrix.node-version != '20.x' }}
        run: npm ci

      # No allowScripts gate exists on this leg's npm (see above) — running
      # plain `npm ci` here would execute every install script unconditionally
      # with no allowlist check at all, a real regression versus the >=22 leg
      # (found by an automated commit review 2026-09-10, same day as the
      # split-per-leg fix). --ignore-scripts makes this leg strictly SAFER
      # than either prior state (nothing runs), not a rollback of the
      # EBADENGINE fix above.
      - name: Install dependencies (Node 20.x — no scripts, no allowScripts gate on this npm)
        if: ${{ matrix.node-version == '20.x' }}
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
