# Publishes this n8n community node package to npm on every vX.Y.Z tag push,
# using npm Trusted Publishing (OIDC) - no stored token, automatic provenance.
#
# n8n's Creator Portal rejects any package version not published with npm
# provenance, and provenance can only be generated inside GitHub Actions'
# OIDC environment - it can never be added retroactively to a locally
# published version. This workflow is what makes verification submission
# possible at all.
#
# Runs each step explicitly (rather than delegating to `n8n-node release`
# inside CI) because `release-it` - which `n8n-node release` wraps - needs an
# interactive terminal: it always shows a version-bump prompt with no flag to
# suppress it, and crashes with `ExitPromptError: User force closed the
# prompt` when run unattended.
#
# ─── ONE-TIME SETUP (npm package owner only, needs their npm login) ───────────
#
# 1. npmjs.com -> this package -> Settings -> Trusted publishing -> GitHub
#    Actions. Configure: org/user, repo name, workflow FILENAME ONLY
#    (publish.yml, not the full path), leave environment blank, allowed
#    actions: npm publish.
# 2. Same package's Settings -> Require two-factor authentication -> "Require
#    two-factor authentication and disallow bypass 2FA tokens" (recommended).
#    This does NOT block trusted publishing - OIDC is architecturally
#    separate (short-lived, per-run credentials, no stored token).
# 3. If an NPM_TOKEN/NPM_ACCESS_TOKEN secret exists from an earlier
#    token-based attempt, delete it from repo secrets and revoke the
#    underlying npm token - it's unused residual risk once OIDC is set up.
#
# ─── RELEASING ──────────────────────────────────────────────────────────────
#
# Bump the version in package.json (same version can't publish twice), commit,
# then: git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#
# ─── VERIFYING ──────────────────────────────────────────────────────────────
#
# npm view <pkg> - look for "published just now by GitHub Actions
# <npm-oidc-no-reply@github.com>". That exact publisher identity is the
# definitive signature that OIDC trusted publishing worked, not a token or a
# human account. The npmjs.com website can lag a few minutes behind the
# registry due to CDN caching; the registry API (what npm install and n8n's
# installer actually read) updates immediately:
#   curl -s https://registry.npmjs.org/<pkg> | jq '.["dist-tags"]'

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing only supports GitHub-hosted runners
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24' # needs >=22.14.0
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing (requires >=11.5.1)
        run: npm install -g npm@12.0.2 # pinned, not @latest - npm 12 silently skips unapproved dependency install scripts by default; an unpinned bump on this live publish pipeline is how that behavior change would go unnoticed

      - name: Fail loudly on any unapproved install script
        run: npm config set strict-allow-scripts true # npm 12 defaults to skip-and-warn; this makes an unreviewed script a hard install failure instead of a silent skip

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Publish (trusted publishing - provenance is automatic, no token needed)
        run: npm publish
        env:
          RELEASE_MODE: 'true' # same prepublishOnly guard as the local publish path
